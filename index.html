<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التطبيق الإسلامي الأسطوري</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    text-align: center;
    padding: 15px;
}

h1 {
    color: #38bdf8;
}

.card {
    background: #1e293b;
    padding: 20px;
    margin: 15px auto;
    border-radius: 15px;
    max-width: 420px;
    box-shadow: 0 0 15px #00000050;
}

button {
    background: #38bdf8;
    border: none;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin: 5px;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: none;
}
</style>
</head>

<body>

<h1>📿 التطبيق الإسلامي المتكامل</h1>

<div class="card">
<h3>📅 التاريخ</h3>
<p id="date"></p>
<p id="hijri"></p>
</div>

<div class="card">
<h3>🤲 ذكر اليوم</h3>
<p id="zekr"></p>
<button onclick="changeZekr()">تغيير الذكر</button>
</div>

<div class="card">
<h3>🌅 أذكار الصباح والمساء</h3>
<button onclick="showMorning()">أذكار الصباح</button>
<button onclick="showEvening()">أذكار المساء</button>
<p id="azkarBox"></p>
</div>

<div class="card">
<h3>🔢 عداد التسبيح</h3>
<p id="counter">0</p>
<button onclick="tasbeeh()">تسبيح</button>
<button onclick="resetCounter()">إعادة</button>
</div>

<div class="card">
<h3>🎂 حاسبة العمر</h3>
<input type="date" id="birth">
<br>
<button onclick="calcAge()">احسب</button>
<p id="age"></p>
</div>

<div class="card">
<h3>🔮 الأبراج</h3>
<input type="date" id="zodiacDate">
<br>
<button onclick="getZodiac()">اعرف برجك</button>
<p id="zodiac"></p>
</div>

<script>
// التاريخ
const today = new Date();
document.getElementById("date").innerText =
    today.toLocaleDateString('ar-EG');

// تحويل هجري (تقريبي)
function toHijri(date){
    let days = Math.floor(date / 86400000) + 2440588;
    let l = days - 1948440 + 10632;
    let n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    let j = (Math.floor((10985 - l) / 5316)) *
            (Math.floor((50 * l) / 17719)) +
            (Math.floor(l / 5670)) *
            (Math.floor((43 * l) / 15238));
    l = l - (Math.floor((30 - j) / 15)) *
        (Math.floor((17719 * j) / 50)) -
        (Math.floor(j / 16)) *
        (Math.floor((15238 * j) / 43)) + 29;
    let m = Math.floor((24 * l) / 709);
    let d = l - Math.floor((709 * m) / 24);
    let y = 30 * n + j - 30;

    return d + "/" + m + "/" + y + " هـ";
}
document.getElementById("hijri").innerText = toHijri(today);

// الأذكار
const azkar = [
"سبحان الله وبحمده سبحان الله العظيم",
"لا إله إلا الله وحده لا شريك له",
"اللهم صل وسلم على نبينا محمد",
"أستغفر الله العظيم وأتوب إليه"
];

function changeZekr(){
    document.getElementById("zekr").innerText =
    azkar[Math.floor(Math.random() * azkar.length)];
}
changeZekr();

// أذكار
function showMorning(){
document.getElementById("azkarBox").innerText =
"أصبحنا وأصبح الملك لله، الحمد لله...";
}

function showEvening(){
document.getElementById("azkarBox").innerText =
"أمسينا وأمسى الملك لله، الحمد لله...";
}

// التسبيح مع حفظ
let count = localStorage.getItem("count") || 0;
document.getElementById("counter").innerText = count;

function tasbeeh(){
    count++;
    localStorage.setItem("count", count);
    document.getElementById("counter").innerText = count;
}

function resetCounter(){
    count = 0;
    localStorage.setItem("count", count);
    document.getElementById("counter").innerText = count;
}

// العمر
function calcAge(){
    let birth = new Date(document.getElementById("birth").value);
    let now = new Date();

    let years = now.getFullYear() - birth.getFullYear();
    let months = now.getMonth() - birth.getMonth();
    let days = now.getDate() - birth.getDate();

    if(days < 0){ months--; days += 30; }
    if(months < 0){ years--; months += 12; }

    document.getElementById("age").innerText =
    `عمرك: ${years} سنة و ${months} شهر و ${days} يوم`;
}

// الأبراج
function getZodiac() {
    let d = new Date(document.getElementById("zodiacDate").value);
    let day = d.getDate();
    let month = d.getMonth() + 1;

    let zodiac = "";

    if ((month==3 && day>=21) || (month==4 && day<=19)) zodiac="الحمل ♈";
    else if ((month==4 && day>=20) || (month==5 && day<=20)) zodiac="الثور ♉";
    else if ((month==5 && day>=21) || (month==6 && day<=20)) zodiac="الجوزاء ♊";
    else if ((month==6 && day>=21) || (month==7 && day<=22)) zodiac="السرطان ♋";
    else if ((month==7 && day>=23) || (month==8 && day<=22)) zodiac="الأسد ♌";
    else if ((month==8 && day>=23) || (month==9 && day<=22)) zodiac="العذراء ♍";
    else if ((month==9 && day>=23) || (month==10 && day<=22)) zodiac="الميزان ♎";
    else if ((month==10 && day>=23) || (month==11 && day<=21)) zodiac="العقرب ♏";
    else if ((month==11 && day>=22) || (month==12 && day<=21)) zodiac="القوس ♐";
    else if ((month==12 && day>=22) || (month==1 && day<=19)) zodiac="الجدي ♑";
    else if ((month==1 && day>=20) || (month==2 && day<=18)) zodiac="الدلو ♒";
    else zodiac="الحوت ♓";

    document.getElementById("zodiac").innerText = "برجك: " + zodiac;
}
</script>

</body>
</html>
