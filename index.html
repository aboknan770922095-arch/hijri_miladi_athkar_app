   <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور الهداية - الإصدار الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #060b1d;
            --bg-card: rgba(13, 22, 45, 0.7);
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --text-main: #ffffff;
            --text-dim: #a0aec0;
            --glass-border: rgba(255, 255, 255, 0.08);
            --grad: linear-gradient(45deg, #00d2ff, #9d50bb);
        }

        .light-mode {
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-dim: #64748b;
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: background 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 100px; }

        header { padding: 30px; text-align: center; position: sticky; top: 0; z-index: 100; background: rgba(6, 11, 29, 0.9); backdrop-filter: blur(15px); }
        .app-logo { font-size: 1.8rem; font-weight: 700; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .section-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; color: var(--neon-blue); font-weight: bold; font-size: 1.2rem; }

        /* الأذكار */
        .azkar-list { display: flex; flex-direction: column; gap: 10px; }
        .azkar-item { background: rgba(255, 255, 255, 0.04); border-radius: 18px; padding: 16px; border: 1px solid var(--glass-border); cursor: pointer; }
        .azkar-header { display: flex; justify-content: space-between; font-weight: 500; font-size: 0.9rem; color: var(--neon-blue); }
        .azkar-content { display: none; margin-top: 12px; color: var(--text-main); font-size: 1.05rem; line-height: 1.8; text-align: justify; }
        .azkar-item.open { background: rgba(0, 210, 255, 0.08); border-color: var(--neon-blue); }
        .azkar-item.open .azkar-content { display: block; }

        /* الإعدادات */
        select { width: 100%; padding: 12px; border-radius: 12px; background: #0f172a; color: white; border: 1px solid var(--neon-blue); margin-top: 10px; font-size: 1rem; outline: none; }

        /* شريط التنقل */
        .nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: rgba(13, 22, 45, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--glass-border); border-radius: 25px 25px 0 0; }
        .nav-item { text-decoration: none; color: var(--text-dim); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .nav-item i { font-style: normal; font-size: 1.4rem; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn { background: var(--grad); border: none; padding: 14px; border-radius: 15px; color: white; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="app-logo" id="lang-title">✨ نور الهداية</div>
    </header>

    <div class="container">
        
        <div id="home" class="page active">
            <div class="card" style="text-align: center;">
                <h3 id="lang-daily">ذكر اليوم</h3>
                <p id="rand-zekr" style="font-size: 1.2rem; margin: 20px 0;">أستغفر الله العظيم وأتوب إليه</p>
                <button class="btn" onclick="newRandZekr()" id="lang-btn-zekr">ذكر آخر</button>
            </div>
        </div>

        <div id="azkar" class="page">
            <div class="card">
                <div class="section-header" id="lang-morn-title">☀️ أذكار الصباح</div>
                <div id="morning-list" class="azkar-list"></div>
            </div>
            <div class="card">
                <div class="section-header" id="lang-eve-title">🌙 أذكار المساء</div>
                <div id="evening-list" class="azkar-list"></div>
            </div>
        </div>

        <div id="settings" class="page">
            <div class="card">
                <div class="section-header">⚙️ <span id="lang-settings">الإعدادات</span></div>
                
                <div style="margin-bottom: 20px;">
                    <label id="lang-select">اختر اللغة (Language):</label>
                    <select id="language-picker" onchange="changeLang(this.value)">
                        <option value="ar">العربية (Arabic)</option>
                        <option value="en">English (الإنجليزية)</option>
                        <option value="tr">Türkçe (التركية)</option>
                    </select>
                </div>

                <button class="btn" onclick="document.body.classList.toggle('light-mode')" id="lang-mode">تبديل الوضع (ليلي/نهاري)</button>
            </div>
        </div>

    </div>

    <nav class="nav">
        <a href="javascript:void(0)" class="nav-item active" onclick="nav('home', this)"><i id="icon-home">🏠</i><span id="nav-home">الرئيسية</span></a>
        <a href="javascript:void(0)" class="nav-item" onclick="nav('azkar', this)"><i id="icon-azkar">📖</i><span id="nav-azkar">الأذكار</span></a>
        <a href="javascript:void(0)" class="nav-item" onclick="nav('settings', this)"><i id="icon-set">⚙️</i><span id="nav-set">الإعدادات</span></a>
    </nav>

    <script>
        // مصفوفة الأذكار الكاملة
        const morningData = [
            { t: "آية الكرسي", c: "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ..." },
            { t: "المعوذات (3 مرات)", c: "قُلْ هُوَ اللَّهُ أَحَدٌ.. قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ.. قُلْ أَعُوذُ بِرَبِّ النَّاسِ.." },
            { t: "أصبحنا وأصبح الملك لله", c: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير." },
            { t: "سيد الاستغفار", c: "اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت." },
            { t: "اللهم إني أسألك العافية", c: "اللهم إني أسألك العافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي..." },
            { t: "يا حي يا قيوم", c: "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين." },
            { t: "بسم الله الذي لا يضر", c: "بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم. (3 مرات)" },
            { t: "حسبي الله لا إله إلا هو", c: "حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم. (7 مرات)" }
        ];

        const eveningData = [
            { t: "أمسينا وأمسى الملك لله", c: "أمسينا وأمسى الملك لله والحمد لله، لا إله إلا الله وحده لا شريك له..." },
            { t: "أعوذ بكلمات الله التامات", c: "أعوذ بكلمات الله التامات من شر ما خلق. (3 مرات)" },
            { t: "اللهم بك أمسينا", c: "اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير." }
        ];

        // نظام اللغات
        const translations = {
            ar: { title: "✨ نور الهداية", daily: "ذكر اليوم", btnZekr: "ذكر آخر", morn: "☀️ أذكار الصباح", eve: "🌙 أذكار المساء", settings: "الإعدادات", select: "اختر اللغة:", navHome: "الرئيسية", navAzkar: "الأذكار", navSet: "الإعدادات" },
            en: { title: "✨ Noor Al-Hidayah", daily: "Dhikr of the Day", btnZekr: "New Dhikr", morn: "☀️ Morning Dhikr", eve: "🌙 Evening Dhikr", settings: "Settings", select: "Choose Language:", navHome: "Home", navAzkar: "Dhikr", navSet: "Settings" },
            tr: { title: "✨ Hidayet Nuru", daily: "Günün Zikri", btnZekr: "Başka Zikir", morn: "☀️ Sabah Zikirleri", eve: "🌙 Akşam Zikirleri", settings: "Ayarlar", select: "Dil Seçin:", navHome: "Ana Sayfa", navAzkar: "Zikirler", navSet: "Ayarlar" }
        };

        function changeLang(lang) {
            const t = translations[lang];
            document.getElementById('lang-title').innerText = t.title;
            document.getElementById('lang-daily').innerText = t.daily;
            document.getElementById('lang-btn-zekr').innerText = t.btnZekr;
            document.getElementById('lang-morn-title').innerText = t.morn;
            document.getElementById('lang-eve-title').innerText = t.eve;
            document.getElementById('lang-settings').innerText = t.settings;
            document.getElementById('lang-select').innerText = t.select;
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('nav-azkar').innerText = t.navAzkar;
            document.getElementById('nav-set').innerText = t.navSet;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }

        function nav(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function renderAllAzkar() {
            const mList = document.getElementById('morning-list');
            const eList = document.getElementById('evening-list');

            morningData.forEach(d => {
                const item = document.createElement('div');
                item.className = 'azkar-item';
                item.innerHTML = `<div class="azkar-header"><span>✨ ${d.t}</span> ⬇️</div><div class="azkar-content">${d.c}</div>`;
                item.onclick = () => item.classList.toggle('open');
                mList.appendChild(item);
            });

            eveningData.forEach(d => {
                const item = document.createElement('div');
                item.className = 'azkar-item';
                item.innerHTML = `<div class="azkar-header"><span>🌙 ${d.t}</span> ⬇️</div><div class="azkar-content">${d.c}</div>`;
                item.onclick = () => item.classList.toggle('open');
                eList.appendChild(item);
            });
        }

        function newRandZekr() {
            const all = [...morningData, ...eveningData];
            document.getElementById('rand-zekr').innerText = all[Math.floor(Math.random()*all.length)].c.substring(0, 100) + "...";
        }

        window.onload = () => { renderAllAzkar(); newRandZekr(); };
    </script>
</body>
 </html>
